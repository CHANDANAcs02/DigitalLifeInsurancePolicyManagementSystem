spring.application.name=DigitalLifeInsurancePolicyManagementSystem

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/digital_life_insurance}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# Cache
# Redis is the default cache provider for the BRD implementation.
# Set CACHE_TYPE=simple only for local testing without Redis.
spring.cache.type=${CACHE_TYPE:redis}

# Redis (used when CACHE_TYPE=redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# JMS / ActiveMQ Classic
# ActiveMQ Classic uses tcp://localhost:61616 by default.
# Override with ACTIVEMQ_BROKER_URL if your broker is elsewhere.
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USERNAME:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
spring.jms.pub-sub-domain=false

# Server
server.port=${SERVER_PORT:8080}

# Multipart uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}

# JWT security (base64-encoded secret; override in production)
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTZWNyZXRLZXlGb3JEZW1vUHVycG9zZXM=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Demo admin account - override these values outside local development
app.admin.email=${ADMIN_EMAIL:admin@insurance.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
